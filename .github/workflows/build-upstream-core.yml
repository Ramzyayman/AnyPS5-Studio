name: Build Upstream Core Binaries

on:
  workflow_dispatch:
  push:
    branches: [main, feature/upstream-sync, feat/linux-studio-support]
    paths:
      - 'core/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-upstream-core.yml'

permissions:
  contents: write
  actions: write

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip

jobs:
  build-windows:
    name: Build Windows x64 Relinker & PRX Libraries
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Point WinLibs CMake at Git CA bundle
        shell: bash
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "::error::No CA bundle found in Git for Windows"; exit 1

      - id: toolchain
        uses: actions/cache@v4
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}

      - if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs

      - name: Add WinLibs to PATH
        shell: bash
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-upstream-sync
          save: true

      - name: Configure CMake
        shell: cmd
        run: cmake -S . -B build %CONFIGURE%

      - name: Build Relinker & System PRX Libraries
        shell: cmd
        run: |
          cmake --build build --target relinker
          cmake --build build --target libs

      - name: Package Core Binaries
        shell: bash
        run: |
          mkdir -p dist-upstream/libs dist-upstream/build
          cp -v build/core/relinker/relinker.exe dist-upstream/build/ || cp -v build/bin/relinker.exe dist-upstream/build/ || cp -v build/relinker.exe dist-upstream/build/
          cp -v build/core/libs/libs/*.prx dist-upstream/libs/
          cp -v /c/winlibs/mingw64/bin/libgcc_s_seh-1.dll dist-upstream/libs/
          cp -v /c/winlibs/mingw64/bin/libstdc++-6.dll dist-upstream/libs/
          cp -v /c/winlibs/mingw64/bin/libwinpthread-1.dll dist-upstream/libs/
          ls -la dist-upstream/build/
          ls -la dist-upstream/libs/

      - name: Upload Core Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyps5-upstream-core-windows-x64
          path: dist-upstream/
          retention-days: 30

  build-linux:
    name: Build Linux x64 Relinker & PRX Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxrandr-dev libx11-dev libxext-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libpipewire-0.3-dev libpulse-dev libasound2-dev

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-upstream-sync
          save: true

      - name: Configure CMake
        run: cmake -S . -B build $CONFIGURE

      - name: Build Relinker & System PRX Libraries
        run: |
          cmake --build build --target relinker
          cmake --build build --target libs

      - name: Package Linux Core Binaries
        run: |
          mkdir -p dist-upstream/libs dist-upstream/build
          cp -v build/core/relinker/relinker dist-upstream/build/ || cp -v build/bin/relinker dist-upstream/build/ || cp -v build/relinker dist-upstream/build/
          chmod +x dist-upstream/build/relinker
          cp -v build/core/libs/libs/*.prx dist-upstream/libs/
          chmod +x dist-upstream/libs/*.prx || true
          ls -la dist-upstream/build/
          ls -la dist-upstream/libs/

      - name: Upload Linux Core Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyps5-upstream-core-linux-x64
          path: dist-upstream/
          retention-days: 30
