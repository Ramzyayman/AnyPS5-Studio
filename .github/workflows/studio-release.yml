name: AnyPS5 Studio Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish AnyPS5 Studio (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact-name: AnyPS5-Studio-Setup
          - os: ubuntu-latest
            platform: linux
            artifact-name: AnyPS5-Studio-AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Fetch relinker binary & PRX libraries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build libs
          echo "Deploying latest core binaries and PRXs for ${{ matrix.platform }}..."
          python tools/deploy_upstream_core.py --platform ${{ matrix.platform }}
          if [ -d "core/libs/overrides" ]; then
            echo "Applying repository PRX overrides..."
            cp -fv core/libs/overrides/* libs/ || true
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            chmod +x build/relinker || true
            chmod +x libs/*.prx || true
          fi
          ls -la build/
          ls -la libs/

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Compile and package Studio installer
        working-directory: ui
        run: npm run dist -- --publish never

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if [[ -z "$tag" || "$tag" == "main" ]]; then
            tag="v$(node -p "require('./ui/package.json').version")"
          fi
          echo "Publishing release $tag to GitHub..."
          extra_args=""
          if [[ "$tag" == *"-"* || "$tag" == *"preview"* || "$tag" == *"rc"* ]]; then
            extra_args="--prerelease"
          fi
          gh release create "$tag" \
            --title "AnyPS5 Studio $tag" \
            --generate-notes \
            $extra_args \
            --verify-tag || true

          if [ "${{ matrix.platform }}" = "windows" ]; then
            gh release upload "$tag" \
              ui/dist-installer/AnyPS5-Studio-Setup-*.exe \
              ui/dist-installer/AnyPS5-Studio-Setup-*.exe.blockmap \
              ui/dist-installer/latest.yml \
              --clobber
          else
            gh release upload "$tag" \
              ui/dist-installer/AnyPS5-Studio-*.AppImage \
              --clobber
            if [ -f ui/dist-installer/latest-linux.yml ]; then
              gh release upload "$tag" ui/dist-installer/latest-linux.yml --clobber
            fi
          fi

      - name: Upload installer workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ui/dist-installer/*.exe
            ui/dist-installer/*.AppImage
            ui/dist-installer/*.blockmap
            ui/dist-installer/*.yml
